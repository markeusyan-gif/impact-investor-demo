gk_h:["Good to know","Perlu diketahui"],
gk_p:["This game uses fake coins only, collects no personal data, and needs no account. Your progress is saved only in your own browser. It is for education, not financial advice, and it does not recommend any real investment. The game is simplified: real markets are more complex, and you can lose real money. If you ever invest, use providers that are licensed in your country.","Game ini hanya memakai koin palsu, tidak mengumpulkan data pribadi, dan tidak butuh akun. Kemajuanmu hanya tersimpan di browser kamu sendiri. Game ini untuk pendidikan, bukan nasihat keuangan, dan tidak merekomendasikan investasi nyata apa pun. Game ini disederhanakan: pasar sungguhan lebih rumit dan kamu bisa kehilangan uang sungguhan. Jika suatu hari kamu berinvestasi, gunakan penyedia yang berizin resmi di negaramu."],

refl_win:["You beat the simple spread-and-hold plan. Was it skill, luck, or the clues? Real markets are less predictable than this game.","Kamu mengalahkan rencana sebar-dan-tahan yang sederhana. Apakah itu keahlian, keberuntungan, atau petunjuk? Pasar sungguhan lebih sulit ditebak daripada game ini."],

per_h:["Your investing personality","Kepribadian investasimu"],per_n:["A fun label from this game only. It is not a real risk profile or financial advice.","Label seru dari game ini saja. Bukan profil risiko sungguhan atau nasihat keuangan."],
pers_bold:["Bold Bettor","Si Berani"],pers_bold_d:["You back a few companies with most of your coins. That can pay off big and hurt big. Next step: spread a little more.","Kamu menaruh sebagian besar koin di beberapa perusahaan. Bisa untung besar dan bisa rugi besar. Langkah berikut: sebar sedikit lebih banyak."],
pers_saver:["Careful Saver","Penabung Hati-hati"],pers_saver_d:["You keep most coins safe in cash. That feels calm, but inflation slowly shrinks idle cash. Next step: let a bit more work for you.","Kamu menyimpan sebagian besar koin sebagai uang tunai. Terasa tenang, tetapi inflasi pelan-pelan mengikis uang menganggur. Langkah berikut: biarkan lebih banyak bekerja untukmu."],
pers_busy:["Busy Trader","Si Sibuk Transaksi"],pers_busy_d:["You trade a lot. Active play is fun, but frequent trading is not always smarter. Next step: try doing less and compare.","Kamu sering bertransaksi. Bermain aktif memang seru, tetapi sering transaksi belum tentu lebih pintar. Langkah berikut: coba lebih sedikit transaksi dan bandingkan."],
pers_chaser:["Clue Chaser","Pengejar Petunjuk"],pers_chaser_d:["You lean on clues a lot. Clues help, but they are never promises. Next step: combine clues with spreading your risk.","Kamu sangat mengandalkan petunjuk. Petunjuk membantu tetapi bukan janji. Langkah berikut: gabungkan petunjuk dengan menyebar risiko."],
pers_steady:["Steady Builder","Pembangun Stabil"],pers_steady_d:["You trade calmly, spread your coins, and keep most of them working. That is a strong habit. Next step: try a harder level.","Kamu bertransaksi dengan tenang, menyebar koin, dan membuat sebagian besar bekerja. Itu kebiasaan yang kuat. Langkah berikut: coba level yang lebih sulit."],
pers_balanced:["Balanced Explorer","Penjelajah Seimbang"],pers_balanced_d:["You mix cash, spreading, and trading. Keep experimenting and look back to learn what works.","Kamu memadukan uang tunai, penyebaran, dan transaksi. Teruslah bereksperimen dan tinjau kembali untuk belajar apa yang berhasil."],

o.querySelector("#qy").onclick=()=>{o.remove();quiz("pre")};o.querySelector("#ql").onclick=()=>{S.preSkip=true;o.remove();render()}}

c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="impact-investor-score.png";a.click()})}
window._ag=el=>{el.closest(".ovl").remove();init(true)};
function endPop(){if(S.r<10||S.es||S.v!==null)return;S.es=1;save();
const sc=score(),g=Math.round(w()-1000),win=sc>=100,Q=win?[["Smart moves pay off. Keep learning!","Langkah cerdas membuahkan hasil. Terus belajar!"]]:[["Every investor loses sometimes. What matters is what you learn. Try again!","Setiap investor pernah rugi. Yang penting adalah pelajarannya. Coba lagi!"],["Patience and spreading risk beat panic. One more round?","Sabar dan menyebar risiko mengalahkan panik. Satu ronde lagi?"]],q=Q[Math.floor(Math.random()*Q.length)];
const o=modal(`<div class="bigc" id="es">0</div><h3>${win?tx("You did it!","Kamu berhasil!"):tx("Not this time","Belum kali ini")}</h3><p class="sub"><i>${q[I()]}</i></p><div class="rk2"><div><span>${tx("Money rank","Peringkat Uang")}</span><b>${mrk()}</b><span>${g>=0?"+":""}${f(g)} ${t("coins")}</span></div><div><span>${tx("Impact rank","Peringkat Dampak")}</span><b>${irk()}</b><span>${f(S.imp)} ${t("pts")}</span></div></div><p class="sub">${t("rank")}: <b>${rank()}</b></p><p><button class="cta" id="sv">${tx("Save image","Simpan gambar")}</button><button onclick="share()">${t("share")}</button></p><p>${S.post===null?`<button class="hl" onclick="quiz_post()">${tx("Final quiz","Kuis akhir")}</button>`:""}<button onclick="_ag(this)">${t("again")}</button><button id="xc">${t("close")}</button></p>`);
countUp(o.querySelector("#es"),sc,x=>x);if(win){snd("win");coinSnd();rain(24)}else snd("bad");

<script>

.diary::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:22px;background:radial-gradient(circle,#c9ced3 0 4px,#4a4f55 5px 6px,transparent 7px) 0 0/22px 40px repeat-y}
.diary::after{content:"";position:absolute;top:-10px;right:34px;width:70px;height:22px;background:rgba(255,235,130,.75);transform:rotate(3deg)}
.diary,.diary *{color:#3a2f1d!important;font-family:inherit}
.diary .dh{font-weight:700;font-size:18px;border-bottom:2px solid #c9a94a;margin-bottom:4px}
.diary .dh span{float:right;font-size:14px}
.diary .tag,.diary .tw,.diary .ts{background:#fff176!important;color:#5a4300!important}
.diary button{background:#fff176!important;border:none!important;box-shadow:1px 2px 0 rgba(0,0,0,.25);transform:rotate(-1.5deg);line-height:1.3;border-radius:4px}
.diary button[style]{background:#ffd54f!important;outline:2px dashed #8d6e63}
/* newspaper */
.paper{position:relative;background-color:#f1e8d0!important;background-image:radial-gradient(rgba(90,70,30,.12) 1px,transparent 1.4px);background-size:5px 5px;border:2px solid #2b2418!important;border-radius:3px!important;box-shadow:6px 6px 0 rgba(0,0,0,.3);font-family:Georgia,"Times New Roman",serif;animation:pin .5s}
.paper,.paper *{color:#2b2418!important;font-family:inherit}
.paper .tag,.paper .tw,.paper .ts{background:#e2d4b0!important}
.paper .mast,.paper .brk,.paper .dl{display:none!important}
.paper::after{content:"";position:absolute;right:0;bottom:0;border-width:0 0 24px 24px;border-style:solid;border-color:transparent transparent var(--page) #c9b98f}
.nm{text-align:center;font-weight:700;font-size:24px;letter-spacing:3px;border-bottom:4px double #2b2418;padding-bottom:4px}
.nd{font-size:11px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #2b2418;margin:4px 0 8px;padding-bottom:2px}
.nb{display:inline-block;background:#c0392b;color:#fff!important;font:700 14px system-ui,sans-serif;letter-spacing:1px;padding:3px 10px;transform:rotate(-2deg);border:2px solid #fff;box-shadow:0 0 0 2px #c0392b;animation:bk 1.1s infinite}
.paper .nb{color:#fff!important}
.paper p[style*="font-weight:600"]{font-size:23px;line-height:1.2;font-weight:700}
.paper .sub{text-align:justify}.paper .sub:first-of-type::first-letter{font-size:1.5em}
@keyframes bk{50%{opacity:.65;transform:rotate(-2deg) scale(1.06)}}
@keyframes pin{from{transform:rotate(-3deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.npulse{outline:4px solid #c0392b;outline-offset:3px}
#toast{display:none!important}
#ntoast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:60;background:#f1e8d0;color:#2b2418;border:2px solid #2b2418;box-shadow:4px 4px 0 rgba(0,0,0,.35);padding:8px 14px;border-radius:3px;font-family:Georgia,serif;max-width:min(420px,calc(100% - 20px));cursor:pointer}
.nov{position:fixed;inset:0;z-index:100;background:rgba(10,15,25,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.nov .paper{max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:16px}

<script>
(function(){
const tx=(a,b)=>L=="id"?b:a;

/* ---- teks baru ---- */
T.m_locked=["You chose Hold for this company. Cancel the hold first if you want to buy or sell.","Kamu memilih Tahan untuk perusahaan ini. Batalkan tahan dulu jika ingin membeli atau menjual."];
T.yourmove_d=["Tap Buy or Sell to trade. Tap Hold on a company you own to lock it for this month: you cannot buy or sell it, and you earn a 1% patience bonus.","Ketuk Beli atau Jual untuk bertransaksi. Ketuk Tahan pada perusahaan yang kamu miliki untuk menguncinya bulan ini: tidak bisa dibeli atau dijual, dan kamu dapat bonus kesabaran 1%."];

/* ---- 1. Beli dan Jual ditolak kalau perusahaan sedang ditahan ---- */
const _buy=buy,_sell=sell;
buy=function(i){if(S.v===null&&S.hd[i]){S.msg="m_locked";snd("err");render();return}_buy(i)};
sell=function(i){if(S.v===null&&S.hd[i]){S.msg="m_locked";snd("err");render();return}_sell(i)};

/* ---- 2. Tahan jadi tombol on/off ---- */
hold=function(i){
  if(S.v!==null)return;
  if(S.hd[i]){S.hd[i]=0;S.holds=Math.max(0,S.holds-1);S.msg="";snd("tap");render();return}
  if(S.sh[i]>0){S.hd[i]=1;S.holds++;S.msg="";snd("hold")}
  else{S.msg="m_nohold";snd("err")}
  render()};

/* ---- 3. Auto-investor tidak boleh menyentuh saham yang ditahan ---- */
const _next=next;
next=function(){window.__held=[...S.hd];_next()};
const _bot=bot;
bot=function(){
  const all=S.rules,held=window.__held||[];
  S.rules=all.filter(r=>!held[r.c]);
  try{_bot()}finally{S.rules=all}};

/* ---- 4. Tampilan: nonaktifkan tombol, ganti label, perjelas penjelasan ---- */
function lock(){
  if(S.v!==null||S.r>=10)return;
  const p=document.querySelector("#buyzone details p.sub");
  if(p)p.innerHTML=
    "<b>"+tx("Buy","Beli")+"</b>: "+tx("spend coins to get a share, a small piece of a company.","tukar koin dengan saham, potongan kecil sebuah perusahaan.")+
    "<br><b>"+tx("Sell","Jual")+"</b>: "+tx("turn a share back into coins at today's price.","ubah saham kembali jadi koin di harga hari ini.")+
    "<br><b>"+tx("Hold","Tahan")+"</b>: "+tx("lock the shares you own for this month. You cannot buy or sell that company until next month (you can cancel the hold). In return you earn a 1% patience bonus on those shares.","kunci saham yang kamu miliki untuk bulan ini. Kamu tidak bisa membeli atau menjual perusahaan itu sampai bulan depan (kamu bisa membatalkan tahan). Sebagai imbalan, kamu dapat bonus kesabaran 1% dari saham itu.");
  S.sh.forEach((_,i)=>{
    const h=!!S.hd[i],
      b=document.querySelector('button[onclick="buy('+i+')"]'),
      s=document.querySelector('button[onclick="sell('+i+')"]'),
      k=document.querySelector('button[onclick="hold('+i+')"]');
    if(!b||!s||!k)return;
    const why=tx("Locked by Hold. Cancel the hold to trade.","Terkunci oleh Tahan. Batalkan tahan untuk bertransaksi.");
    [b,s].forEach(x=>{x.disabled=h;x.title=h?why:""});
    k.disabled=!h&&S.sh[i]<1;
    k.title=k.disabled?tx("You do not own shares here yet.","Kamu belum punya saham di sini."):"";
    k.innerHTML=h?ic("restart",14)+" "+tx("Cancel hold","Batal tahan"):ic("pause",14)+" "+t("hold");
    const lb=k.nextElementSibling;
    if(h&&lb&&lb.classList.contains("ts"))
      lb.innerHTML=ic("check",13)+" "+tx("Locked, +1% bonus","Terkunci, bonus +1%");
  })}

const _r=render;
render=function(){_r();lock()};
render();
})();
</script>

<script>
(function(){
const $=id=>document.getElementById(id),tx=(a,b)=>L=="id"?b:a;

/* ---------- clearer description, not gambling ---------- */
T.tag=["Free learning game about money and the SDGs","Game belajar gratis tentang uang dan SDG"];
T.h1=["Learn how investing works, with fake coins.","Pelajari cara kerja investasi, dengan koin palsu."];
T.hp=["Run a virtual island portfolio and see how risk, inflation, and patience work. A learning game: not gambling, no real money, not financial advice.","Kelola portofolio di pulau virtual dan lihat bagaimana risiko, inflasi, dan kesabaran bekerja. Ini game belajar: bukan judi, tanpa uang sungguhan, dan bukan nasihat keuangan."];
T.gk_p=["This game uses fake coins only and needs no account. Your progress is saved only in your own browser. If you send feedback, only the message you write (and an email, if you add one) is sent to the creator. It is for education: it is not gambling, not financial advice, and it does not recommend any real investment. The game is simplified: real markets are more complex, and you can lose real money. If you ever invest, use providers that are licensed in your country.","Game ini hanya memakai koin palsu dan tidak butuh akun. Kemajuanmu hanya tersimpan di browser kamu sendiri. Jika kamu mengirim masukan, hanya pesan yang kamu tulis (dan email, jika kamu menambahkannya) yang dikirim ke pembuat. Game ini untuk pendidikan: bukan judi, bukan nasihat keuangan, dan tidak merekomendasikan investasi nyata apa pun. Game ini disederhanakan: pasar sungguhan lebih rumit dan kamu bisa kehilangan uang sungguhan. Jika suatu hari kamu berinvestasi, gunakan penyedia yang berizin resmi di negaramu."];
T.pers_bold[0]="Bold Backer";
T.sharemsg=["I reached the rank {r} in Impact Investor with a score of {s} on {l} level. Try this learning game too!","Aku mencapai peringkat {r} di Impact Investor dengan skor {s} di level {l}. Coba game belajar ini juga!"];

/* ---------- island scene ---------- */
const W="M0 178 q25 -8 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V220 H0Z";
const SCENE=cls=>`<svg class="${cls}" viewBox="0 0 400 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><circle class="isun" cx="305" cy="125" r="22" fill="#ffd54a"/><g class="icl"><ellipse cx="60" cy="40" rx="30" ry="9" fill="#fff" opacity=".85"/><ellipse cx="80" cy="35" rx="20" ry="8" fill="#fff" opacity=".85"/></g><g class="ibd"><path d="M20 70 q6 -6 12 0 q6 -6 12 0" stroke="#34495e" fill="none" stroke-width="1.5"/></g><path d="M190 172 Q260 112 340 172Z" fill="#4f9d5a"/><path d="M225 172 Q265 135 310 172Z" fill="#3e8548"/><rect x="300" y="152" width="14" height="10" fill="#b5651d"/><path d="M297 152 L307 144 L317 152Z" fill="#8b4a2b"/><ellipse cx="265" cy="172" rx="85" ry="7" fill="#f1d9a0"/><path d="M268 168 Q262 142 270 118" stroke="#7a5230" stroke-width="4" fill="none"/><g class="ipalm"><path d="M270 118 q-28 -6 -38 12 q22 -12 38 -12z" fill="#2f7d3a"/><path d="M270 118 q-20 -18 -42 -6 q24 -2 42 6z" fill="#2f7d3a"/><path d="M270 118 q28 -6 38 12 q-22 -12 -38 -12z" fill="#2f7d3a"/><path d="M270 118 q20 -18 42 -6 q-24 -2 -42 6z" fill="#2f7d3a"/></g><rect y="170" width="400" height="50" fill="#3b8fc4"/><g transform="translate(60 168)"><g class="ibt"><g class="ib2"><path d="M0 0 H42 L35 11 H7Z" fill="#b5651d"/><path d="M21 0 V-30" stroke="#5a3a1a" stroke-width="2"/><path d="M22 -29 L22 -4 L40 -4Z" fill="#fff"/><path d="M20 -26 L20 -4 L6 -4Z" fill="#e5243b"/></g></g></g><path class="iw1" d="${W}" fill="#4aa3d8" opacity=".8"/><path class="iw2" transform="translate(0 12)" d="${W}" fill="#2f7fb3" opacity=".85"/></svg>`;

/* ---------- texts ---------- */
const WEL={
h:["Welcome to Impact Investor!","Selamat datang di Impact Investor!"],
p:["A free learning game about money, risk, and the SDGs.","Game belajar gratis tentang uang, risiko, dan SDG."],
bh:["Before you start","Sebelum mulai"],
b:[["This is a learning game, not gambling. No bets, no prizes, no real money.","Ini game belajar, bukan judi. Tanpa taruhan, hadiah, atau uang sungguhan."],
["All coins are fake. Nothing here is financial advice or a tip to invest.","Semua koin palsu. Tidak ada yang di sini merupakan nasihat keuangan atau ajakan berinvestasi."],
["Real investing carries risk and you can lose money. Learn first, and never invest money you cannot afford to lose.","Investasi sungguhan berisiko dan kamu bisa kehilangan uang. Belajar dulu, dan jangan investasikan uang yang tidak siap kamu rugikan."]],
n:["No account needed. Progress is saved only in your browser.","Tanpa akun. Kemajuan hanya tersimpan di browser kamu."]};
const BACK={
h:["Welcome back to Impact Investor!","Selamat datang kembali di Impact Investor!"],
saved:["Your game is saved. You are in month {r} of 10.","Permainanmu tersimpan. Kamu ada di bulan {r} dari 10."],
done:["Your last game is finished. Review your results or play again.","Permainan terakhirmu sudah selesai. Lihat hasilnya atau main lagi."],
rem:["A learning game with fake coins. Not gambling, not financial advice.","Game belajar dengan koin palsu. Bukan judi, bukan nasihat keuangan."],
go:["Continue my game","Lanjutkan permainan"],
story:["Watch the story","Lihat cerita"]};
const LN=[
["Welcome to Harapan Island. Here you practice thinking about money.","Selamat datang di Pulau Harapan. Di sini kamu berlatih berpikir tentang uang."],
["Imagine your first job. Your salary arrives each month.","Bayangkan pekerjaan pertamamu. Gaji masuk tiap bulan."],
["Needs, savings, and an emergency fund come first. Investing is optional.","Kebutuhan, tabungan, dan dana darurat didahulukan. Investasi bersifat pilihan."],
["Got extra coins left? Practice with them here. No real money.","Ada koin sisa? Berlatihlah di sini. Tanpa uang sungguhan."]];
const TOTAL=2+LN.length;

function swell(){if(!SND)return;const a=actx();if(!a)return;const n=a.sampleRate*4,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=l*.97+(Math.random()*2-1)*.03;c[i]=l*4*Math.sin(Math.PI*i/n)}const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type="lowpass";f.frequency.value=600;g.gain.value=.25;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}

/* ---------- new vs returning ---------- */
let busy=false,shown=false;
const seen=()=>{try{return localStorage.getItem("iij_seen")==="1"}catch(e){return false}};
const markSeen=()=>{try{localStorage.setItem("iij_seen","1")}catch(e){}};
const returning=()=>seen()||S.r>0||S.trades>0||S.holds>0;
function clearEarly(){document.querySelectorAll(".ovl:not(.intro),.coin").forEach(e=>e.remove());S.wel=0}

/* ---------- intro ---------- */
/* ret = returning player. storyOnly = jump straight to the story (used by the Story button). */
function intro(ret,storyOnly){
busy=true;let k=(ret&&storyOnly)?2:0;
const o=document.createElement("div");o.className="ovl intro";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");
o.innerHTML=`<div class="itop"><div class="ilg" id="ilg"></div><button class="isk" id="isk"></button></div>${SCENE("isc")}<div class="imain" id="ibody"></div><div class="iac" id="iac"></div>`;
document.body.appendChild(o);
const q=s=>o.querySelector(s);
const fin=()=>{markSeen();o.classList.add("out");setTimeout(()=>{o.remove();busy=false;render()},500)};
const setLang=l=>{if(L===l)return;L=l;try{localStorage.setItem("iij_lang",L)}catch(e){}ap();draw()};
const adv=()=>{if(k<TOTAL-1){k++;draw()}};
function draw(){
const i=L=="id"?1:0,body=q("#ibody"),ac=q("#iac"),sk=q("#isk"),lg=q("#ilg");
lg.innerHTML=["en","id"].map(l=>`<button data-l="${l}" class="${L===l?"on":""}" aria-pressed="${L===l}">${l=="en"?"English":"Bahasa Indonesia"}</button>`).join("");
lg.querySelectorAll("button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
body.scrollTop=0;
sk.style.display=k>=2?"":"none";sk.textContent=tx("Skip story","Lewati cerita");sk.onclick=fin;
if(ret&&k==0){
const msg=S.r>=10?BACK.done[i]:(S.r>0?fm(BACK.saved[i],{r:S.r}):"");
body.innerHTML=`<div style="color:#185FA5">${ic("coin",40)}</div><div class="iwt">${BACK.h[i]}</div>${msg?`<p class="iws">${msg}</p>`:""}<p class="iws" style="font-size:14px">${BACK.rem[i]}</p>`;
ac.innerHTML=`<button class="cta big" id="ib1">${BACK.go[i]}</button><button class="big" id="ib2">${BACK.story[i]}</button>`;
}else if(k==0){
body.innerHTML=`<div style="color:#185FA5">${ic("coin",40)}</div><div class="iwt">${WEL.h[i]}</div><p class="iws">${WEL.p[i]}</p>`;
ac.innerHTML=`<button class="cta big" id="inx">${tx("Continue","Lanjut")}</button>`;
}else if(k==1){
body.innerHTML=`<div class="ibx"><b>${WEL.bh[i]}</b><ul>${WEL.b.map(x=>`<li>${x[i]}</li>`).join("")}</ul><small>${WEL.n[i]}</small></div>`;
ac.innerHTML=`<button class="cta big" id="inx">${tx("I understand, continue","Saya mengerti, lanjut")}</button>`;
}else{
const last=k==TOTAL-1;
body.innerHTML=`<div class="ist"><p>${LN[k-2][i]}</p></div>`;
if(SND)tone(660+k*60,.4,"sine",.04);
ac.innerHTML=last?`<button class="cta" id="ig">${ret?tx("Back to my game","Kembali ke game"):tx("Start my journey","Mulai perjalananku")}</button>`:`<button id="inx">${tx("Next","Lanjut")}</button>`;
}
const nx=q("#inx"),g=q("#ig"),b1=q("#ib1"),b2=q("#ib2");
if(nx)nx.onclick=()=>{if(k==0)swell();adv()};
if(g)g.onclick=()=>{if(SND)[523,659,784].forEach((f,j)=>tone(f,.3,"triangle",.06,j*.1));fin()};
if(b1)b1.onclick=fin;
if(b2)b2.onclick=()=>{swell();k=2;draw()};
const b=ac.querySelector("button");if(b)try{b.focus({preventScroll:true})}catch(e){}
}
draw()}
window._story=()=>{if(!busy)intro(true,true)};

/* ---------- Story button in the top bar ---------- */
function sbtn(){const nv=document.querySelector("nav .navr");if(!nv)return;
let b=$("storybtn");
if(!b){nv.insertAdjacentHTML("afterbegin",'<button id="storybtn" onclick="_story()"></button>');b=$("storybtn")}
b.innerHTML=ic("book",15)+'<span class="lb2"> '+tx("Story","Cerita")+'</span>';
const t2=tx("Watch the intro story","Lihat cerita pembuka");b.title=t2;b.setAttribute("aria-label",t2)}

/* ---------- practice-coins wording in the first popup ---------- */
new MutationObserver(m=>m.forEach(r=>r.addedNodes.forEach(n=>{
if(n.nodeType!==1||!n.querySelector)return;
const h=n.querySelector("h3");
if(h&&/first salary|Gaji pertama/i.test(h.textContent)){
h.textContent=tx("Your practice coins are ready!","Koin latihanmu sudah siap!");
const p=n.querySelector("p.sub");
if(p)p.textContent=tx("You have 1,000 extra coins to practice with. They are pretend coins. Nothing is guaranteed to grow.","Kamu punya 1.000 koin sisa untuk berlatih. Ini koin palsu. Tidak ada yang dijamin tumbuh.")}
}))).observe(document.body,{childList:true});

/* ---------- header strip, reminder, disclaimer ---------- */

const note=()=>{const sc=document.querySelector("#app .scorecard");if(sc&&!$("vnote"))sc.insertAdjacentHTML("afterend",`<div class="card" id="vnote"><span class="tw">${tx("Remember","Ingat")}</span><p class="sub">${tx("Not investing is also a valid choice. In real life, build an emergency fund first and only invest money you can afford to lose.","Memilih tidak berinvestasi juga pilihan yang sah. Di dunia nyata, siapkan dana darurat dulu dan hanya investasikan uang yang siap kamu rugikan.")}</p></div>`)};
const _ap=ap;
ap=function(){_ap();sbtn();const pl=document.querySelector("#play .sub");if(pl){let d=$("pdis");if(!d){pl.insertAdjacentHTML("afterend",'<p class="sub" id="pdis" style="font-size:13px"></p>');d=$("pdis")}d.innerHTML=tx("Practice only: fake coins, not gambling, not financial advice. Real investing can lose money.","Hanya latihan: koin palsu, bukan judi, bukan nasihat keuangan. Investasi sungguhan bisa merugikan.")}};

/* ---------- render hook: intro once per page open ---------- */
const _r=render;
render=function(){
if(!busy&&!shown){shown=true;const ret=returning();if(!ret)clearEarly();intro(ret,false)}
_r();note()};
ap();
render();
})();
</script>

<!-- ============================================================
  LOCAL EXAMPLES (arisan, IDX, reksa dana, SBN, gold, koperasi, bank sampah, investasi bodong)
  HOW TO USE: paste this whole block right before </body> in impact-investor-demo.html
  (after the last </script>). Nothing else needs to change.
  It adds: a "Local examples" section after "Meet the companies",
  a nav link, English + Bahasa Indonesia, light + dark theme, and a small arisan simulator.
============================================================ -->

<script>
(function(){
const $=id=>document.getElementById(id),tx=(a,b)=>L=="id"?b:a;
const AR={turn:1,skip:false};                 /* arisan simulator state */
const N=CO.length;                            /* number of island companies in the game */

/* ---------- the examples: edit the text here ---------- */
const EX=()=>[
{i:"coin",t:tx("Arisan","Arisan"),
 d:tx("Friends or neighbors each pay the same amount every round, and one person takes the whole pot. Many groups pick the order with a lucky draw. It runs on trust and usually pays no interest.",
      "Teman atau tetangga menyetor jumlah yang sama tiap putaran, lalu satu orang membawa seluruh uang yang terkumpul. Banyak kelompok menentukan urutan lewat kocokan. Berjalan atas dasar kepercayaan dan biasanya tanpa bunga."),
 g:tx("<b>In the game:</b> coins in an arisan do not grow, but they are also not tied to a company's ups and downs. Try the simulator below.",
      "<b>Di game:</b> uang arisan tidak bertambah, tetapi juga tidak ikut naik turun seperti harga saham. Coba simulatornya di bawah.")},
{i:"trend",t:tx("IDX: the Indonesia Stock Exchange","IDX: Bursa Efek Indonesia"),
 d:tx("The IDX in Jakarta is where shares of Indonesian companies are bought and sold. The IHSG (Composite Index) shows how all listed shares move together.",
      "IDX di Jakarta adalah tempat saham perusahaan Indonesia dibeli dan dijual. IHSG (Indeks Harga Saham Gabungan) menunjukkan gerak seluruh saham yang tercatat."),
 g:tx(`<b>In the game:</b> the ${N} island companies are made up, but buying a share works the same way: you own a small piece of a company.`,
      `<b>Di game:</b> ${N} perusahaan pulau itu rekaan, tetapi cara beli sahamnya sama: kamu memiliki sebagian kecil perusahaan.`)},
{i:"shield",t:tx("Reksa dana (mutual fund)","Reksa dana"),
 d:tx("Many people put money into one pot, and a professional manager spreads it over many investments. It is a way to share the risk, and many funds accept small amounts.",
      "Banyak orang mengumpulkan uang dalam satu wadah, lalu manajer profesional menyebarnya ke banyak investasi. Ini cara berbagi risiko, dan banyak produk menerima setoran kecil."),
 g:tx("<b>In the game:</b> same idea as spreading your coins over 3 to 5 companies instead of putting everything in one.",
      "<b>Di game:</b> idenya sama dengan menyebar koin ke 3 sampai 5 perusahaan, bukan semuanya di satu tempat.")},
{i:"book",t:tx("SBN: government bonds (ORI, Sukuk Ritel)","SBN: surat berharga negara (ORI, Sukuk Ritel)"),
 d:tx("You lend money to the government, and it pays you regular interest or profit sharing. Usually calmer than shares, but terms differ, so read them before buying.",
      "Kamu meminjamkan uang ke pemerintah, lalu menerima bunga atau bagi hasil secara berkala. Biasanya lebih tenang daripada saham, tetapi syaratnya berbeda-beda, jadi baca dulu sebelum membeli."),
 g:tx("<b>In the game:</b> think of cash and safe savings. Lower ups and downs usually means lower possible gains.",
      "<b>Di game:</b> anggap seperti kas dan tabungan aman. Naik turun yang lebih kecil biasanya berarti peluang untung yang lebih kecil.")},
{i:"sun",t:tx("Gold (emas)","Emas"),
 d:tx("Many families keep gold as savings. Its price goes up and down, and it pays no dividends or interest.",
      "Banyak keluarga menyimpan emas sebagai tabungan. Harganya naik turun, dan tidak memberi dividen atau bunga."),
 g:tx("<b>In the game:</b> a good reminder that no choice is guaranteed to grow. Compare it with the dividends companies pay.",
      "<b>Di game:</b> pengingat bahwa tidak ada pilihan yang dijamin tumbuh. Bandingkan dengan dividen yang dibayar perusahaan.")},
{i:"recycle",t:tx("Koperasi and bank sampah","Koperasi dan bank sampah"),
 d:tx("A koperasi is owned by its members, who share the results. At a bank sampah, neighbors bring sorted trash and get savings credit for it.",
      "Koperasi dimiliki anggotanya, yang berbagi hasilnya. Di bank sampah, warga membawa sampah terpilah dan mendapat saldo tabungan."),
 g:tx("<b>In the game:</b> GreenLoop runs community waste banks. Money and impact can go together (SDG 12).",
      "<b>Di game:</b> GreenLoop mengelola bank sampah warga. Uang dan dampak bisa berjalan bersama (SDG 12).")}
];

function arisanHTML(){
return `<div class="card lxar"><b>${ic("coin",16)} ${tx("Try an arisan","Coba arisan")}</b>
<p class="sub">${tx("5 friends pay 100 coins each round. Pick the round when you win the pot, and see what happens to your coins.","5 teman menyetor 100 koin tiap putaran. Pilih putaran saat kamu menang, lalu lihat apa yang terjadi pada koinmu.")}</p>
<div class="ctl"><label>${tx("You win in round","Kamu menang di putaran")} <select id="lxT">${[1,2,3,4,5].map(n=>`<option value="${n}"${AR.turn==n?" selected":""}>${n}</option>`).join("")}</select></label>
<label><input type="checkbox" id="lxS"${AR.skip?" checked":""}> ${tx("One friend stops paying after round 2","Satu teman berhenti menyetor setelah putaran 2")}</label></div>
<div id="lxO"></div></div>`}

function arisanOut(){
const o=$("lxO");if(!o)return;
const n=5,c=100,t=AR.turn,sk=AR.skip;let net=0,rows="";
for(let r=1;r<=n;r++){
 const pot=c*((sk&&r>2)?n-1:n),get=r==t?pot:0;net+=get-c;
 rows+=`<tr><td>${r}${r==t?" "+ic("trophy",13):""}</td><td>-${f(c)}</td><td>${get?"+"+f(get):"0"}</td><td class="${net>=0?"up":"dn"}"><b>${net>0?"+":""}${f(net)}</b></td></tr>`}
const when=t<=2?tx("You got the pot early. It works like a loan from your friends with no interest, and you still have to keep paying.","Kamu dapat uangnya lebih awal. Ini seperti pinjaman tanpa bunga dari teman, dan kamu tetap harus terus menyetor.")
 :t>=4?tx("You waited for your turn. Until then you were lending coins to your friends.","Kamu menunggu giliran. Selama itu kamu meminjamkan koin ke teman-temanmu.")
 :tx("You are in the middle: first you lend, then you receive.","Kamu di tengah: mula-mula meminjamkan, lalu menerima.");
const end=net==0?tx("After 5 rounds you get back exactly what you paid. Arisan does not make coins grow. Its strength is saving discipline and community.","Setelah 5 putaran kamu menerima persis yang kamu setor. Arisan tidak membuat koin bertambah. Kekuatannya ada pada disiplin menabung dan kebersamaan.")
 :tx(`You end ${f(-net)} coins short because the pot got smaller. That is the trust risk of arisan: it only works if everyone keeps paying.`,`Kamu rugi ${f(-net)} koin karena uang yang terkumpul mengecil. Itulah risiko kepercayaan di arisan: hanya berjalan kalau semua terus menyetor.`);
o.innerHTML=`<div style="overflow-x:auto"><table><tr><th>${tx("Round","Putaran")}</th><th>${tx("You pay","Kamu setor")}</th><th>${tx("You receive","Kamu terima")}</th><th>${tx("Your total","Total kamu")}</th></tr>${rows}</table></div><div class="lxres">${when}<br><b>${end}</b></div>`}

function build(){
const co=$("co");if(!co)return;
let s=$("local");if(!s){s=document.createElement("section");s.id="local";co.insertAdjacentElement("afterend",s)}
s.innerHTML=`<h2>${tx("Local examples you may already know","Contoh lokal yang mungkin sudah kamu kenal")}</h2>

function setLogo(){
 const el=document.getElementById("logo");
 if(el)el.innerHTML='<img src="'+ICON+'" alt="" width="30" height="30" style="display:block;border-radius:8px"> Impact Investor';
}
function setIcons(){
 document.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]').forEach(l=>l.remove());
 ["icon","apple-touch-icon"].forEach(r=>{const l=document.createElement("link");l.rel=r;l.href=ICON;document.head.appendChild(l)});
}
const _ap=ap;ap=function(){_ap();setLogo()};
setLogo();setIcons();
})();
